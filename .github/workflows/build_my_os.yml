name: Tự tạo hệ điều hành pi armbian A7A
on:
  workflow_dispatch:

jobs:
  build-armbian:
    runs-on: ubuntu-latest
    steps:
      - uses: NickAlilovic/build@Radxa-A7A
        with:
          armbian_token: "${{ secrets.GITHUB_TOKEN }}"
          armbian_target: "build"
          armbian_board: "radxa-cubie-a7a"
          armbian_release: "bookworm"
          armbian_ui: "xfce"
