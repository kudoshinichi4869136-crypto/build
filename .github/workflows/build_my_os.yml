name: Tự tạo hệ điều hành pi armbian A7A
on:
  workflow_dispatch:

jobs:
  build-armbian:
    runs-on: ubuntu-22.04
    steps:
      - name: Tải mã nguồn hỗ trợ Radxa Cubie A7A
        uses: actions/checkout@v4
        with:
          repository: NickAlilovic/build
          ref: Radxa-A7A

      - name: Đóng gói hệ điều hành Desktop trong Docker
        run: |
          # Thêm tham số DOCKER_BUILD=yes để ép Armbian chạy bên trong Docker container, tránh lỗi binfmts của host
          ./compile.sh docker build BOARD=radxa-cubie-a7a BRANCH=legacy BUILD_DESKTOP=yes BUILD_MINIMAL=no DESKTOP_ENVIRONMENT=xfce DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED="browsers" KERNEL_CONFIGURE=no RELEASE=bookworm EXPERT=yes DOWNLOAD_UBOOT=yes DOCKER_BUILD=yes

      - name: Xuất file cài đặt ra ngoài
        uses: actions/upload-artifact@v4
        with:
          name: pi-armbian-cubie-a7a
          path: output/images/*.img*
